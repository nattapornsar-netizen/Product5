<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmileBrush | แปรงสีฟัน</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4fbfa;--card:#fff;--tx:#17302e;--ac:#0f9d8a;--mut:#5c7673}
@media (prefers-color-scheme:dark){:root{--bg:#10201f;--card:#182b29;--tx:#e8f5f3;--ac:#3cc9b5;--mut:#9bb8b4}}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5%;font-weight:700}
header a{color:var(--ac);text-decoration:none;font-size:14px}
.hero{text-align:center;padding:50px 5%}
.hero h1{font-size:clamp(28px,6vw,48px);margin:0 0 10px}
.hero p{color:var(--mut)}
.btn{background:var(--ac);color:#fff;border:0;padding:10px 20px;border-radius:24px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding:10px 5%}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:170px;object-fit:cover;border-radius:12px;background:#cfeeea}
.price{color:var(--ac);font-weight:700;font-size:20px}
form{max-width:520px;margin:30px auto;padding:20px;background:var(--card);border-radius:16px}
input,textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #8884;background:var(--bg);color:var(--tx);font:inherit}
.qty{width:70px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #8883;text-align:left;font-size:14px}
.wrap{padding:20px 5%;overflow-x:auto}
#label{display:none}
@media print{body>*:not(#label){display:none!important}#label{display:block;border:2px solid #000;padding:16px;width:380px;color:#000;background:#fff;font-size:16px}}
</style>
</head>
<body>
<header><span>🦷 SmileBrush</span><a href="#admin" id="nav">หน้าแอดมิน</a></header>

<!-- ===== หน้าร้าน ===== -->
<div id="store">
  <section class="hero">
    <h1>แปรงสีฟันขนนุ่ม ยิ้มสดใสทุกวัน</h1>
    <p>ขนแปรงนุ่มพิเศษ ดูแลเหงือก ส่งตรงถึงบ้าน</p>
    <a class="btn" href="#order">สั่งซื้อเลย</a>
  </section>
  <div class="grid" id="products">กำลังโหลดสินค้า...</div>
  <form id="order" onsubmit="return submitOrder(event)">
    <h3>กรอกข้อมูลสั่งซื้อ</h3>
    <div id="items"></div>
    <input id="cname" placeholder="ชื่อผู้รับ" required>
    <input id="cphone" placeholder="เบอร์โทร" required>
    <textarea id="caddr" rows="3" placeholder="ที่อยู่จัดส่ง" required></textarea>
    <p>รวม: <b id="total">0</b> บาท</p>
    <button class="btn">ยืนยันคำสั่งซื้อ</button>
    <p id="msg"></p>
  </form>
</div>

<!-- ===== หน้าแอดมิน: หยิบ-แพ็ก-พิมพ์ใบจ่าหน้า ===== -->
<div id="admin" style="display:none" class="wrap">
  <h2>รายการสั่งซื้อ (หยิบสินค้า &amp; แพ็ก)</h2>
  <table><thead><tr><th>#</th><th>เวลา</th><th>ผู้รับ</th><th>รายการหยิบ</th><th></th></tr></thead><tbody id="orders"></tbody></table>
</div>
<div id="label"></div>

<script>
// ====== ตั้งค่า: ใส่ลิงก์หลังทำ Google Sheet / Apps Script ======
const PRODUCTS_CSV_URL = "";  // ลิงก์ Publish to web (CSV) ของแท็บ Products
const SCRIPT_URL = "";        // ลิงก์ Web App ของ Apps Script (บันทึก/ดึงออเดอร์)
// ข้อมูลสำรองเมื่อยังไม่ได้ตั้งค่า (รูปอยู่ในโฟลเดอร์ images/)
const DEMO = [
 {sku:"TB-001",name:"แปรงสีฟันขนนุ่ม รุ่น Soft",price:59,image:"images/tb-001.jpg",desc:"ขนนุ่ม 0.01 มม. เหมาะกับเหงือกบอบบาง"},
 {sku:"TB-002",name:"แปรงสีฟันไม้ไผ่ รุ่น Eco",price:79,image:"images/tb-002.jpg",desc:"ด้ามไม้ไผ่ รักษ์โลก ย่อยสลายได้"}
];
let products=[];

function parseCSV(t){const rows=t.trim().split(/\r?\n/).map(r=>r.split(","));const h=rows.shift().map(x=>x.trim());
  return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim()])));}

async function loadProducts(){
  try{
    if(PRODUCTS_CSV_URL){const t=await (await fetch(PRODUCTS_CSV_URL)).text();products=parseCSV(t).map(p=>({...p,price:+p.price}));}
    else products=DEMO;
  }catch(e){products=DEMO;}
  document.getElementById("products").innerHTML=products.map(p=>`
   <div class="card"><img src="${p.image}" alt="${p.name}" onerror="this.removeAttribute('src')">
   <h3>${p.name}</h3><p>${p.desc||""}</p><div class="price">${p.price} บาท</div>
   <small>SKU: ${p.sku}</small></div>`).join("");
  document.getElementById("items").innerHTML=products.map((p,i)=>`
   <label>${p.name} (${p.price}฿)</label><input class="qty" type="number" min="0" value="0" data-i="${i}" oninput="calc()">`).join("<br>");
}
function calc(){let s=0;document.querySelectorAll(".qty").forEach(q=>s+=q.value*products[q.dataset.i].price);document.getElementById("total").textContent=s;}

async function submitOrder(e){
  e.preventDefault();
  const items=[...document.querySelectorAll(".qty")].filter(q=>+q.value>0).map(q=>({sku:products[q.dataset.i].sku,name:products[q.dataset.i].name,qty:+q.value}));
  if(!items.length){msg("กรุณาเลือกสินค้าอย่างน้อย 1 ชิ้น");return false;}
  const o={time:new Date().toLocaleString("th-TH"),name:cname.value,phone:cphone.value,address:caddr.value,items:JSON.stringify(items),total:total.textContent};
  try{
    if(SCRIPT_URL) await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(o)});
    else {const l=JSON.parse(localStorage.getItem("orders")||"[]");l.push(o);localStorage.setItem("orders",JSON.stringify(l));}
    msg("✅ สั่งซื้อสำเร็จ ขอบคุณค่ะ");e.target.reset();calc();
  }catch(x){msg("เกิดข้อผิดพลาด ลองใหม่อีกครั้ง");}
  return false;
}
function msg(t){document.getElementById("msg").textContent=t;}

async function loadOrders(){
  let list=[];
  try{list=SCRIPT_URL?await (await fetch(SCRIPT_URL)).json():JSON.parse(localStorage.getItem("orders")||"[]");}catch(e){}
  window._o=list;
  document.getElementById("orders").innerHTML=list.map((o,i)=>{
    const it=JSON.parse(o.items||"[]");
    return `<tr><td>${i+1}</td><td>${o.time}</td><td>${o.name}<br>${o.phone}</td>
    <td>${it.map(x=>`☐ ${x.sku} ${x.name} × <b>${x.qty}</b>`).join("<br>")}</td>
    <td><button class="btn" onclick="printLabel(${i})">พิมพ์ใบจ่าหน้า</button></td></tr>`;}).join("")||"<tr><td colspan=5>ยังไม่มีออเดอร์</td></tr>";
}
function printLabel(i){
  const o=_o[i],it=JSON.parse(o.items||"[]");
  document.getElementById("label").innerHTML=`<h3>ใบจ่าหน้าพัสดุ #${i+1}</h3>
   <b>ผู้ส่ง:</b> SmileBrush<hr><b>ผู้รับ:</b> ${o.name}<br>โทร: ${o.phone}<br>${o.address}<hr>
   <b>สินค้า:</b><br>${it.map(x=>`${x.sku} × ${x.qty}`).join("<br>")}<br><b>ยอดรวม:</b> ${o.total} บาท`;
  window.print();
}
function route(){const a=location.hash==="#admin";
  store.style.display=a?"none":"block";admin.style.display=a?"block":"none";
  nav.textContent=a?"กลับหน้าร้าน":"หน้าแอดมิน";nav.href=a?"#":"#admin";if(a)loadOrders();}
addEventListener("hashchange",route);loadProducts();route();
</script>
</body>
</html>
